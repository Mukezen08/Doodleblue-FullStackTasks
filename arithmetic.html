<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Arithmetic Operations</title>
</head>
<body>
    <h2>Arithmetic Operations</h2>
    <label for="a">Number A:</label>
    <input type="number" id="a" name="a">
    <br><br>
    <label for="b">Number B:</label>
    <input type="number" id="b" name="b">
    <br><br>
    <button id="add">Add</button>
    <button id="subtract">Subtract -</button>
    <button id="multiply">Multiply *</button>
    <button id="divide">Divide /</button>
    <button id="increment">Increment ++</button>
    <button id="decrement">Decrement --</button>
    <button id="reset">Reset</button>
    <h3>Result: <span id="result">0</span></h3>
<script>
    let count = 0;
    const btn = document.getElementById("add");
    function add(){ 
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);
        let result = a + b;
        document.getElementById("result").innerText = result;
    }
    btn.addEventListener("click", add)
    const btn2 = document.getElementById("subtract");
    function subtract(){
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);
        let result = a - b;
        document.getElementById("result").innerText = result;
    }
    btn2.addEventListener("click", subtract)
    const btn3 = document.getElementById("multiply");
    function multiply(){
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);
        let result = a * b;
        document.getElementById("result").innerText = result;
    }
    btn3.addEventListener("click", multiply)
    const btn4 = document.getElementById("divide");
    function divide(){
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);
        if(b !== 0){
            let result = a / b;
            document.getElementById("result").innerText = result;
        }
    btn4.addEventListener("click", divide)
    }
    const btn5 = document.getElementById("increment");
    function increment(){
        count++;
        document.getElementById("result").innerText = count;
    }
    btn5.addEventListener("click", increment)
    const btn6 = document.getElementById("decrement");
    function decrement(){
        count--;
        document.getElementById("result").innerText = count;
    }
    btn6.addEventListener("click", decrement)
    const btn7 = document.getElementById("reset");
    function reset(){
        count = 0;
        document.getElementById("result").innerText = count;
    }
    btn7.addEventListener("click", reset)

</script>
</body>
</html>
